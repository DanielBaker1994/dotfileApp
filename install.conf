APP_NAME="kitchen-sink"
BUNDLE_ID="dev.danielbaker.kitchen-sink"

SIGN_ID="kitchen-sink codesign"

MACOS_MIN="26.7"

APP_VERSION="1.0.0"
DMG_NAME="kitchen-sink"

DEVELOPER_ID=""
NOTARY_PROFILE=""

RESOURCE_LINK_DIRS="bin jira confluence notify pylib settings_hub"

RESOURCE_SEED_DIRS="rules config"
RESOURCE_FILES="install.conf symlinks.sh UNINSTALL.sh app_icon.png menubar_icon.png jira_icon.png confluence_icon.png"

RESOURCE_BIN="kitchen_sink.sh aerospace-monitors.sh no_stray_workspaces.sh check-macos.sh preflight.sh setup-home.sh fake-confluence.sh ws-settings ws-logs lib.sh text-table quick-agent.sh"

# notify AX helpers: rust/ws-helpers binaries, bundled into Resources/helpers-bin
HELPER_BINS="dock_badges webex_unread"

WS_HOME_DEFAULT="$HOME/.config/kitchen-sink"

BREW_FORMULAE="aerospace borders jq ripgrep pandoc rust"
BREW_CASKS="font-hack-nerd-font"
BREW_SERVICES="borders"

CONFIG_DIRS="aerospace borders"

JIRA_AGENT_LABEL="com.jira.poll"
JIRA_AGENT_PLIST="$HOME/Library/LaunchAgents/$JIRA_AGENT_LABEL.plist"

# login item for the quick agent (Hyper+S / Hyper+X): bin/quick-agent.sh
QUICK_AGENT_LABEL="dev.danielbaker.kitchen-sink.quick"
QUICK_AGENT_PLIST="$HOME/Library/LaunchAgents/$QUICK_AGENT_LABEL.plist"

CACHE_DIRS="$HOME/.cache/kitchen-sink $HOME/.cache/jira"
RUNTIME_FILES="/tmp/ws-notes.sock /tmp/ws-aerospace-focus /tmp/kitchen-sink-focus"
