# install.conf — every name / path the install, uninstall and build scripts
# use (INSTALL.sh, UNINSTALL.sh, bin/build-app.sh, bin/workspace_switcher.sh).
# Plain bash `KEY=value` (it is sourced). ~ is spelled $HOME. App behavior
# settings live in commands.conf, not here.

# ---- app bundle / signing
APP_NAME="workspace-switcher"
BUNDLE_ID="dev.danielbaker.workspace-switcher"
# self-signed login-keychain cert (stable TCC grants across rebuilds);
# missing → ad-hoc signature
SIGN_ID="workspace-switcher codesign"
# Swift sources compiled into the app: every top-level *.swift in the repo
# (so a new file can never be forgotten by one of the build paths)
SWIFT_SOURCES_GLOB="*.swift"

# ---- brew dependencies (INSTALL.sh)
BREW_FORMULAE="aerospace sketchybar borders jq ripgrep"
BREW_CASKS="karabiner-elements font-sketchybar-app-font font-hack-nerd-font"
BREW_SERVICES="sketchybar borders"

# ---- configs copied from the repo's config/<name> to ~/.config/<name>
# (existing ones are backed up to $BACKUP_PREFIX-<timestamp> first)
CONFIG_DIRS="aerospace sketchybar borders"
BACKUP_PREFIX="/tmp/ws-backup"
UNINSTALL_BACKUP_PREFIX="/tmp/ws-uninstall"

# ---- jira poll launchd agent (template: jira/$JIRA_AGENT_LABEL.plist)
JIRA_AGENT_LABEL="com.jira.poll"
JIRA_AGENT_PLIST="$HOME/Library/LaunchAgents/$JIRA_AGENT_LABEL.plist"

# ---- removed by UNINSTALL.sh (your notes and ~/.config/jira are kept)
CACHE_DIRS="$HOME/.cache/workspace-switcher $HOME/.cache/jira"
RUNTIME_FILES="$HOME/.cache/ws-crash.log $HOME/.cache/ws-aero.log $HOME/.cache/aero-debug $HOME/.cache/ws-auth-debug $HOME/.cache/ws-auth.log $HOME/.cache/ws-voice-debug.log /tmp/ws-notes.sock /tmp/ws-aerospace-focus /tmp/workspace-switcher-focus /tmp/ws-debug.log ${TMPDIR:-/tmp}/ws-launch.log"
