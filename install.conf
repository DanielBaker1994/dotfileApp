# install.conf — every name / path the install, uninstall and build scripts
# use (INSTALL.sh, UNINSTALL.sh, bin/build-app.sh, bin/kitchen_sink.sh).
# Plain bash `KEY=value` (it is sourced). ~ is spelled $HOME. App behavior
# settings live in commands.toml, not here.

# ---- app bundle / signing
APP_NAME="kitchen-sink"
BUNDLE_ID="dev.danielbaker.kitchen-sink"
# self-signed login-keychain cert (stable TCC grants across rebuilds);
# missing → ad-hoc signature
SIGN_ID="workspace-switcher codesign"
# Swift sources compiled into the app: every top-level *.swift in the repo
# (so a new file can never be forgotten by one of the build paths)
SWIFT_SOURCES_GLOB="*.swift"
# minimum macOS the app runs on. swiftc defaults to its own SDK's minos (which
# can be NEWER than the machine's macOS -> LaunchServices refuses to launch,
# error -10825), so pin it explicitly. Two components, e.g. 13.0.
# bin/check-macos.sh gates every build (and INSTALL.sh) on the host running at
# least this; lowering it rebuilds SwiftTerm + relinks the app automatically.
MACOS_MIN="26.7"

# ---- distribution (bin/make-dmg.sh; `bin/build-app.sh --dist` builds the
# self-contained bundle in .build/dist). The dev build ignores all of this.
APP_VERSION="1.0.0"
DMG_NAME="kitchen-sink"
# Developer ID Application identity (`security find-identity -v -p
# codesigning`) + a notarytool keychain profile (`xcrun notarytool
# store-credentials`). Both empty -> an ad-hoc DMG: fine on your own Macs,
# everyone else has to use System Settings ▸ Privacy & Security ▸ Open Anyway.
DEVELOPER_ID=""
NOTARY_PROFILE=""
# copied into Contents/Resources (the app install reads its code from there;
# ~/.config/kitchen-sink gets links to each — bin/setup-home.sh)
RESOURCE_LINK_DIRS="bin jira confluence notify vim pylib settings_hub"
# seeded into ~/.config/kitchen-sink as the user's own, editable copies
RESOURCE_SEED_DIRS="rules config"
RESOURCE_FILES="install.conf symlinks.sh UNINSTALL.sh app_icon.png jira_icon.png notes_icon.png confluence_icon.png"
# bin/ scripts an installed app needs (the rest are build / test tools)
RESOURCE_BIN="kitchen_sink.sh aerospace-monitors.sh no_stray_workspaces.sh utils.sh check-macos.sh preflight.sh setup-home.sh fake-confluence.sh ws-settings"
# unread-count helpers (notify/), precompiled for machines without a Swift compiler
HELPER_SOURCES="notify/helpers/dock_badges.swift notify/helpers/webex_unread.swift"
# the stable location every external config points at
WS_HOME_DEFAULT="$HOME/.config/kitchen-sink"

# ---- embedded terminal library (SwiftTerm) — fetched at build time, never
# committed (bin/ensure-swiftterm.sh): shallow-clones SWIFTTERM_URL at
# SWIFTTERM_PIN into SWIFTTERM_DIR, applies SWIFTTERM_PATCH (perf fix on top of
# the pinned upstream commit = the copy this app tested), and runs the upstream
# generator for Generated/{GenBuildInfo,GenTerminfo}.swift.
# SWIFTTERM_DIR is resolved against the repo root and deliberately sits OUTSIDE
# the git tree (a sibling of this repo) so the checkout never shows up in git /
# file watchers. Point it anywhere; change it and the next build re-fetches.
SWIFTTERM_URL="https://github.com/migueldeicaza/SwiftTerm.git"
SWIFTTERM_PIN="d50f9866a8ec681729fe2835341a25dc1e0dce3e"
SWIFTTERM_DIR="../SwiftTerm"
SWIFTTERM_PATCH="patches/swiftterm-cellstorage-cache.patch"

# ---- brew dependencies (INSTALL.sh)
BREW_FORMULAE="aerospace borders jq ripgrep pandoc"
BREW_CASKS="font-hack-nerd-font"
BREW_SERVICES="borders"

# ---- configs symlinked file-by-file from the repo's config/<name> into
# ~/.config/<name> (a real file in the way is reported and left alone — never
# moved or deleted; UNINSTALL.sh removes only the links)
CONFIG_DIRS="aerospace borders"

# ---- jira poll launchd agent (template: jira/$JIRA_AGENT_LABEL.plist)
JIRA_AGENT_LABEL="com.jira.poll"
JIRA_AGENT_PLIST="$HOME/Library/LaunchAgents/$JIRA_AGENT_LABEL.plist"

# ---- removed by UNINSTALL.sh (your notes and ~/.config/jira are kept)
CACHE_DIRS="$HOME/.cache/kitchen-sink $HOME/.cache/jira"
RUNTIME_FILES="$HOME/.cache/ws-crash.log $HOME/.cache/ws-aero.log $HOME/.cache/aero-debug $HOME/.cache/ws-auth-debug $HOME/.cache/ws-auth.log $HOME/.cache/ws-voice-debug.log /tmp/ws-notes.sock /tmp/ws-aerospace-focus /tmp/kitchen-sink-focus /tmp/ws-debug.log ${TMPDIR:-/tmp}/ws-launch.log"
