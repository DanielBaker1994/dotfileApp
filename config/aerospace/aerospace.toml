exec-on-workspace-change = [
  '/opt/homebrew/bin/bash', '-c', '~/.config/kitchen-sink/bin/no_stray_workspaces.sh &'
]

on-focus-changed = [
  'exec-and-forget [ -n "$AEROSPACE_WINDOW_ID" ] && printf %s "$AEROSPACE_WINDOW_ID" >"${TMPDIR:-/tmp}/ws-aerospace-focus"'
]

config-version = 2

start-at-login = true

auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = true

persistent-workspaces = ["G", "M", "Y", "W", "N", "1", "2", "3", "4", "5", "6", "7", "8", "9"]

on-mode-changed = []

focus-follows-mouse.enabled = false

key-mapping.preset = 'qwerty'

on-window-detected = [

  { if = 'test %{app-bundle-id} = dev.danielbaker.kitchen-sink', run = ['layout tiling', 'move-node-to-workspace 2'] },

  { if = "test %{app-bundle-id} ~= '^(com[.]microsoft[.]|com[.]apple[.](finder|Preview)$)' || test %{app-name} ~= 'webex'", run = ['layout tiling', 'layout v_accordion'], check-further-callbacks = true },

{ if = 'test %{app-bundle-id} = com.mitchellh.ghostty && test %{window-title} = ws-settings', run = ['layout floating'] },
{ if = 'test %{app-bundle-id} = com.mitchellh.ghostty', run = ['move-node-to-workspace 1'] },
{ if = 'test %{app-bundle-id} = dev.zed.zed', run = ['move-node-to-workspace 2'] },
{ if = 'test %{app-bundle-id} = com.github.GitHubClient', run = ['move-node-to-workspace G'] },
{ if = 'test %{app-bundle-id} = org.jkiss.dbeaver.core.product', run = ['move-node-to-workspace 3'] },
{ if = 'test %{app-bundle-id} = com.microsoft.Excel', run = ['move-node-to-workspace 8'] },
{ if = 'test %{app-bundle-id} = com.google.Chrome', run = ['move-node-to-workspace Y'] },
{ if = 'test %{app-bundle-id} = com.microsoft.Outlook', run = ['move-node-to-workspace M'] },
{ if = 'test %{app-bundle-id} = com.apple.MobileSMS', run = ['move-node-to-workspace M'] },
  { if = 'test %{app-bundle-id} = Cisco-Systems.Spark', run = ['layout v_accordion', 'move-node-to-workspace 9'] },
{ if = 'test %{app-bundle-id} = com.citrix.receiver.nomas', run = ['move-node-to-workspace W'] },
{ if = 'test %{app-bundle-id} = com.spotify.client', run = ['move-node-to-workspace W'] }
]

[gaps]
inner.horizontal = [{ monitor.main = 10 }, 10]
inner.vertical =   [{ monitor.main = 5 }, 10]
outer.left =       [{ monitor.main = 10 }, 10]
outer.right =      [{ monitor.main = 10 }, 10]
outer.bottom =     [{ monitor.main = 10 }, 10]
outer.top =        [{ monitor.main = 10 }, 10]

# >>> monitor-layout

[workspace-to-monitor-force-assignment]
1 = ['main']
2 = ['main']
3 = ['main']
4 = ['main']
5 = ['main']
6 = ['main']
7 = ['main']
8 = ['main']
G = ['main']
M = ['main']
Y = ['main']
W = ['main']
N = ['main']
9 = ['secondary', 'main']
# <<< monitor-layout

[mode.main.binding]

    alt-cmd-ctrl-shift-s = 'exec-and-forget ~/.config/kitchen-sink/bin/kitchen_sink.sh'

    alt-cmd-ctrl-shift-x = 'exec-and-forget ~/.config/kitchen-sink/kitchen-sink.app/Contents/MacOS/kitchen-sink screenshot'

    alt-cmd-ctrl-shift-slash = 'exec-and-forget ~/.config/kitchen-sink/bin/ws-settings open'

    alt-slash = 'layout tiles horizontal vertical'

    alt-shift-slash = ['layout v_tiles', 'balance-sizes']
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-g = 'workspace G'
    alt-m = 'workspace M'
    alt-y = 'workspace Y'
    alt-w = 'workspace W'

    alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
    alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
    alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
    alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
    alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
    alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'
    alt-shift-g = 'move-node-to-workspace G --focus-follows-window'
    alt-shift-m = 'move-node-to-workspace M --focus-follows-window'
    alt-shift-y = 'move-node-to-workspace Y --focus-follows-window'
    alt-shift-w = 'move-node-to-workspace W --focus-follows-window'

    alt-tab = 'workspace-back-and-forth'

    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
