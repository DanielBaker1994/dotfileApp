# Quick reference (AeroSpace CLI):
#   aerospace list-windows --all --format "%{window-id} | %{app-name} | %{workspace} | %{window-parent-container-layout} | %{window-title}"
#   aerospace layout v_accordion
#   aerospace layout h_accordion
#   aerospace layout v_tiles
#   aerospace layout h_tiles
#   aerospace reload-config && sketchybar --reload
# re-apply rules to open windows (generic, no restart)
#   aerospace run-callback --for-every-window on-window-detected  
after-startup-command = [
# sketchybar is also managed by brew services; sketchybar has built-in
# detection of an already-running process, so this is a no-op if brew already
# started it (and only actually launches it if brew hasn't).
'exec-and-forget sketchybar'
]

# Notify Sketchybar about workspace change.
# The KEY=VALUE payload arrives in the subscribed item's script as ENVIRONMENT
# variables (sketchybar does not pass them positionally), and
# sketchybar/plugins/aerospacer.sh reads $FOCUSED_WORKSPACE to move the highlight.
exec-on-workspace-change = [
  '/opt/homebrew/bin/bash', '-c', 'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE; ~/.config/workspace-switcher/bin/no_stray_workspaces.sh &'
]


# Notify Sketchybar about focus change (window opened/closed/moved).
# Debounced in aerospacer.sh to 1/sec so it doesn't block aerospace's
# main thread (aerospace #230).
# The second line is the workspace-switcher focus bridge: it records the
# newly focused window id for the daemon (macOS won't activate an accessory
# app from another process, so the daemon self-activates when aerospace
# focuses it; it watches the file, no polling). Inline on purpose: ONE
# process (exec-and-forget's /bin/bash, printf is a builtin) instead of a
# script + env + bash — every exec is scanned on a managed Mac.
on-focus-changed = [
  'exec-and-forget sketchybar --trigger aerospace_focus_change',
  'exec-and-forget [ -n "$AEROSPACE_WINDOW_ID" ] && printf %s "$AEROSPACE_WINDOW_ID" >"${TMPDIR:-/tmp}/ws-aerospace-focus"'
]

# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# Config version for compatibility and deprecations
# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
#after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Automatically reload the config when the config file is saved
# After setting this to true, reload once manually to start the auto-reloading
auto-reload-config = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# This config option is only available since 'config-version = 2'
# Fallback value (if you omit the key): persistent-workspaces = []
persistent-workspaces = ["G", "M", "Y", "W", "1", "2", "3", "4", "5", "6", "7", "8", "9"]

# A callback that runs every time binding mode changes
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

focus-follows-mouse.enabled = false

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Floating: workspace-switcher, Finder, Preview, Webex and the Microsoft
# stack. Everything else tiles by default — the OLD catch-all `true ->
# layout tiling` rule is gone because it also force-tiled app dialogs (Word
# "Save or Don't Save", NSAlert popups, etc.), which then couldn't be focused
# properly; the dialog heuristic floats those now.
# Raycast's launcher is auto-ignored by aerospace (since 0.18.3) so it needs no rule.
on-window-detected = [
  # workspace-switcher (notes / files / jira / AI / confluence, its
  # dialogs): v_accordion. The app never tiles or floats itself — this rule
  # is the one place that decides (v_accordion can't un-float a window the
  # dialog heuristic floated). Each view is its own window, re-detected on
  # every show / view switch, so this runs often: keep it first and cheap.
  # The Hyper+S palette and the "/" tool panels (filefast, paths,
  # prettyprint, health-checks) are NSPanels: AeroSpace never sees them.
  { if = 'test %{app-bundle-id} = dev.danielbaker.workspace-switcher', run = ['layout v_accordion'] },
  # VS Code is Microsoft too, but an editor: it tiles on 2 (stops here,
  # before the Microsoft float rule below)
  { if = 'test %{app-bundle-id} = com.microsoft.VSCode', run = ['move-node-to-workspace 2'] },
  # tile Finder, Preview, Webex (matched by app name) and every other Microsoft
  # app (Word, Excel, PowerPoint, Outlook, Teams, OneNote, OneDrive, Edge,
  # AutoUpdate…) into v_accordion; `layout tiling` first because v_accordion
  # can't unfloat. check-further-callbacks: the workspace rules below still apply
  { if = "test %{app-bundle-id} ~= '^(com[.]microsoft[.]|com[.]apple[.](finder|Preview)$)' || test %{app-name} ~= 'webex'", run = ['layout tiling', 'layout v_accordion'], check-further-callbacks = true },
#{ if = 'test %{app-bundle-id} = org.flameshot', run = ['layout floating'] },
#{ if = 'test %{app-bundle-id} = com.apple.ActivityMonitor', run = ['move-node-to-workspace 1'] },
#{ if = 'test %{app-bundle-id} = com.apple.TextEdit', run = ['move-node-to-workspace 1'] },
{ if = 'test %{app-bundle-id} = com.mitchellh.ghostty', run = ['move-node-to-workspace 1'] },
{ if = 'test %{app-bundle-id} = dev.zed.zed', run = ['move-node-to-workspace 2'] },
{ if = 'test %{app-bundle-id} = com.github.GitHubClient', run = ['move-node-to-workspace G'] },
{ if = 'test %{app-bundle-id} = org.jkiss.dbeaver.core.product', run = ['move-node-to-workspace 3'] },
{ if = 'test %{app-bundle-id} = com.microsoft.Excel', run = ['move-node-to-workspace 8'] },
{ if = 'test %{app-bundle-id} = com.google.Chrome', run = ['move-node-to-workspace Y'] },
{ if = 'test %{app-bundle-id} = com.microsoft.Outlook', run = ['move-node-to-workspace M'] },
{ if = 'test %{app-bundle-id} = com.apple.MobileSMS', run = ['move-node-to-workspace M'] },
{ if = 'test %{app-bundle-id} = Cisco-Systems.Spark', run = ['move-node-to-workspace W'] },
{ if = 'test %{app-bundle-id} = com.citrix.receiver.nomas', run = ['move-node-to-workspace W'] },
{ if = 'test %{app-bundle-id} = com.spotify.client', run = ['move-node-to-workspace W'] }
]


# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors


[gaps]
inner.horizontal = [{ monitor.main = 10 }, 10]
inner.vertical =   [{ monitor.main = 5 }, 10]
outer.left =       [{ monitor.main = 10 }, 10]
outer.right =      [{ monitor.main = 10 }, 10]
outer.bottom =     [{ monitor.main = 10 }, 10]
outer.top =        [{ monitor."built-in" = 15 }, 48]  # notch screen: visibleFrame already starts 33.5pt down

# Pin workspaces to monitors. 9 ALWAYS has a screen of its own: when a
# monitor connects, AeroSpace shows an invisible workspace already assigned
# to it; if none exists it invents the first unused number that is not in
# persistent-workspaces -> "10" (no keybinding). Force-assigning 9 to the
# other screen means it never has to invent one (bin/no_stray_workspaces.sh
# cleans up if it still does).
# The block between the markers is REWRITTEN by
# bin/aerospace-monitors.sh main|inverse|toggle (service mode: alt-shift-;
# then m flips it):
#   main     1-8 + letters on the main monitor (menu bar), 9 on the other
#   inverse  1-8 + letters on the secondary monitor, 9 on the main one
# With one screen every pattern falls back to it ('main').
# >>> monitor-layout
# mode: main  (1-8 + letters on the main monitor, 9 on the secondary)
[workspace-to-monitor-force-assignment]
1 = ['main']
2 = ['main']
3 = ['main']
4 = ['main']
5 = ['main']
6 = ['main']
7 = ['main']
8 = ['main']
G = ['main']
M = ['main']
Y = ['main']
W = ['main']
9 = ['secondary', 'main']
# <<< monitor-layout

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # Workspace switcher popup: Hyper+S (Hyper = all four modifiers;
    # AeroSpace has no `hyper` keyword, so it's spelled out as
    # alt-cmd-ctrl-shift). Hyper+N/T run the app BINARY directly (a ~20ms
    # socket ping; no bash) — the running daemon records the focused window
    # and moves our window onto the current workspace itself (never spawns
    # a duplicate).
    alt-cmd-ctrl-shift-s = 'exec-and-forget ~/.config/workspace-switcher/bin/workspace_switcher.sh'
    # Hyper+N = THE show / hide key for the shared window: it comes back on
    # the view you were last on (notes, AI, files, jira, confluence); switch
    # views inside it (Ctrl+Tab, header icons) or from the Hyper+S palette.
    alt-cmd-ctrl-shift-n = 'exec-and-forget ~/.config/workspace-switcher/workspace-switcher.app/Contents/MacOS/workspace-switcher window'
    # Notes terminal: Hyper+T — notes + its terminal drawer, focused; in the
    # terminal already -> close the drawer, focus the notes editor.
    alt-cmd-ctrl-shift-t = 'exec-and-forget ~/.config/workspace-switcher/workspace-switcher.app/Contents/MacOS/workspace-switcher terminal'
    # Global window switcher: fuzzy-search all windows (fzf) in a Ghostty
    # window that closes itself after you pick one. Works from any app.
    # NOTE: not alt-space -- Option+Space is macOS's non-breaking-space char
    alt-slash = 'layout tiles horizontal vertical'
    # Vertical counterpart of alt-slash: stack all windows vertically in the
    # focused container, then balance all window sizes in the workspace.
    alt-shift-slash = ['layout v_tiles', 'balance-sizes']
    alt-comma = 'layout accordion horizontal vertical'

    # NOTE: alt-h/j/k/l conflicts with tmux's M-h/j/k/l pane resize, but oh well.
    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'



    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-g = 'workspace G'
    alt-m = 'workspace M'
    alt-y = 'workspace Y'
    alt-w = 'workspace W'

    alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
    alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
    alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
    alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
    alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
    alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'
    alt-shift-g = 'move-node-to-workspace G --focus-follows-window'
    alt-shift-m = 'move-node-to-workspace M --focus-follows-window'
    alt-shift-y = 'move-node-to-workspace Y --focus-follows-window'
    alt-shift-w = 'move-node-to-workspace W --focus-follows-window'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']
    # flip which monitor owns 1-8 + letters vs 9 (bin/aerospace-monitors.sh)
    m = ['exec-and-forget ~/.config/workspace-switcher/bin/aerospace-monitors.sh toggle', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

