[package]
name = "ws-rs"
version = "0.1.0"
edition = "2021"
description = "kitchen-sink, ported from Swift/AppKit to Rust via objc2"
license = "MIT"

[[bin]]
name = "kitchen-sink"
path = "src/main.rs"

# The egui frontend is the non-macOS UI (Wave 4+). It is always enabled off
# macOS; on macOS it is optional so the AppKit path stays the default build,
# and `--features egui` turns on the `WS_FRONTEND=egui` dev switch.
[features]
egui = ["dep:eframe", "dep:egui_extras", "dep:egui", "dep:egui_commonmark", "dep:alacritty_terminal"]

# Portable dependencies (build on every target).
[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
egui_extras = { version = "0.32", default-features = false, optional = true }
egui = { version = "0.32", default-features = false, features = ["default_fonts"], optional = true }
# Prose rendering for the egui Notes view (0.21.1 is the release that tracks
# egui 0.32; `default-features = false` drops the image loaders).
egui_commonmark = { version = "0.21.1", default-features = false, optional = true }
# The egui terminal panel (W6-A) drives alacritty_terminal directly: `egui_term`
# tracks egui 0.31, not the 0.32 this frontend uses.
alacritty_terminal = { version = "0.26.0", default-features = false, optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
rmpv = "1"
open = "5"

# AppKit / Objective-C bindings: macOS only. Target-gating them here is what
# makes `cargo check` on Linux surface the AppKit leaks Wave 1 gates (the Linux
# frontend replaces these crates). macOS still resolves them identically.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"
objc2-web-kit = "0.3.2"
objc2-vision = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-quick-look-ui = "0.3.2"
swiftterm-shim = { path = "../swiftterm-shim" }

# The egui frontend is the non-macOS UI (always on off macOS; the `[features]
# egui` switch above makes it optional for macOS dev runs only).
[target.'cfg(not(target_os = "macos"))'.dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.32", default-features = false }
egui = { version = "0.32", default-features = false, features = ["default_fonts"] }
egui_commonmark = { version = "0.21.1", default-features = false }
alacritty_terminal = { version = "0.26.0", default-features = false }

# Non-macOS clipboard (macOS keeps objc2 NSPasteboard; arboard links AppKit
# there, so it must stay target-gated).
arboard = { version = "3", default-features = false }

# Non-macOS file pickers (macOS keeps the objc2 NSOpenPanel code; rfd's own
# macOS backend would link AppKit, so it must stay target-gated too).
# `async-std` is required: xdg-portal pulls ashpd, and without it ashpd never
# enables zbus/async-io, so zbus hard-errors on Linux. It is a feature of the
# named dep, not a new dependency (and avoids tokio).
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

# Non-macOS Jira status stamps: macOS parses the poller's local
# "yyyy-MM-dd HH:mm:ss" stamps with `NSDateFormatter`; elsewhere `time` parses
# the same format (the local-time conversion uses libc `mktime`).
time = { version = "0.3", features = ["parsing"] }

# Non-macOS display capture (platform/capture.rs). macOS keeps the
# ScreenCaptureKit path in views/screenshot.rs, so this stays target-gated;
# `xcap` links X11/Wayland through system libs on Linux (see the check image's
# `libdbus-1-dev`). Pinned exactly so the Linux compile is reproducible.
xcap = { version = "=0.4.1" }
