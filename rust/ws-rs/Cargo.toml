[package]
name = "ws-rs"
version = "0.1.0"
edition = "2021"
description = "kitchen-sink, ported from Swift/AppKit to Rust via objc2"
license = "MIT"

[[bin]]
name = "kitchen-sink"
path = "src/main.rs"

[dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"
objc2-web-kit = "0.3.2"
objc2-vision = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
rmpv = "1"
swiftterm-shim = { path = "../swiftterm-shim" }
objc2-quick-look-ui = "0.3.2"
