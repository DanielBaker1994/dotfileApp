[package]
name = "ks-core"
version = "0.1.0"
edition = "2021"
description = "kitchen-sink shared core: platform seams, UI framework, engines and the views the quick agent uses (no dependency on ws-rs / host.rs)"
license = "MIT"

# ks-core carries the AppKit /
# portable code. (Modules here must never reference ws-rs.)

# Portable dependencies (build on every target).
[dependencies]

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
rmpv = "1"
open = "5"

# AppKit / Objective-C bindings: macOS only. Target-gating them here is what
# makes `cargo check` on Linux surface the AppKit leaks Wave 1 gates (the Linux
# frontend replaces these crates). macOS still resolves them identically.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"
objc2-web-kit = "0.3.2"
objc2-pdf-kit = "0.3.2"
objc2-vision = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-quick-look-ui = "0.3.2"
objc2-image-io = "0.3.2"
objc2-core-foundation = "0.3.2"
