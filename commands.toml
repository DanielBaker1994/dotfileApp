[app]
margin-top = 10
margin-top-builtin = 10
margin-bottom = 10
header-style = "quiet"
# false = menu bar icon only (no Dock icon / Cmd+Tab entry); restart to apply
dock-icon = false

shell = "/opt/homebrew/bin/bash"

shell-args = "--login -i"

terminal-font = "Courier New"
terminal-font-size = 30

font-install-casks = "JetBrains Mono Nerd Font|font-jetbrains-mono-nerd-font|nerd, Fira Code Nerd Font|font-fira-code-nerd-font|nerd, Iosevka Term Nerd Font|font-iosevka-term-nerd-font|nerd, IBM Plex Mono|font-ibm-plex-mono|mono, Cascadia Code|font-cascadia-code|mono, Inter|font-inter|sans, Source Serif 4|font-source-serif-4|serif"

aerospace-cli = "/opt/homebrew/bin/aerospace, /usr/local/bin/aerospace, aerospace"

app-dirs = "/Applications, /Applications/Utilities, /System/Applications, /System/Applications/Utilities, /System/Library/CoreServices, ~/Applications"

app-icon = "app_icon.png"
jira-icon = "jira_icon.png"
confluence-icon = "confluence_icon.png"
ai-icon = ""
files-icon = ""

notes-socket = "ws-notes.sock"
focus-file = "kitchen-sink-focus"
focus-bridge = "ws-aerospace-focus"
switcher-name = "kitchen-sink"

palette-first = "paths, filefast, text-table, prettyprint"
# The Hyper+S palette: these commands, in this order, then your AeroSpace
# workspaces + their apps — one list. Empty = every in-palette command.
palette = "paths, filefast, text-table, prettyprint"
switcher-width = 760
detail-name = "jira-detail"

# Log paths: all logs now live in logs/YYYY_MM_DD/*.log (see pylib/log_hub.py)
# These config keys are kept for compatibility but point to the repo's logs/ dir.
# Log paths are managed by pylib/log_hub.py
# All logs go to logs/YYYY_MM_DD/*.log (date-based rolling)

voice-locale = "en-US"
screenshot-apps = "org.flameshot, pl.maketheweb.cleanshotx, cc.ffitch.shottr, com.skitch.skitch"
hide-on-focus-loss = false

preview-border = "#c0c0c0"
preview-border-width = 2

pane-focus-color = "8cc8ced8"
pane-focus-width = 1

vim-keys = true
vim-mode-badge = true

[theme]

background = "192330"
highlight = "2B3B51"
text = "CDCECF"
dim = "AEAFB0"
accent = "719CD6"
header = "0F141C"
browser = "131A24"
terminal = "111720"
accent2 = "9D79D6"
success = "81B29A"
warning = "DBC074"
danger = "C94F6D"
info = "63CDCF"

[themes]

[paths]
enabled = true
type = "shell"
  label = "Find Recent Files"
icon = "folder"
sticky = true
float = true
limit = 25
return = "file"
clipboard = true
ignore-file = "config/paths.ignore"
aliases = "recent"

[text-table]
enabled = true
type = "shell"
label = "Text to Table"
icon = "notes"
aliases = "table, ocr table, outlook table"
save-dir = "/tmp/text-table"
close-on-copy = true
width = 900
height = 600


[filefast]
enabled = true
sticky = true
float = true
type = "shell"
label = "Create File"
icon = "notes"
save-dir = "/tmp/filefast"
script = "mkdir -p \"$FF_DIR\" && cat > \"$FF_DIR/$FF_NAME\" && printf %s \"$FF_DIR/$FF_NAME\" | pbcopy && printf %s \"$FF_DIR/$FF_NAME\""
aliases = "quickfiles, quick files"


[pane-find]
rows = 12
width = 640

[screenshot]

history = 20
enabled = true
in-palette = false
label = "Screenshot"
type = "shell"
icon = "camera"
ui-color = "#740096"
contrast-color = "#270032"
contrast-opacity = 188
draw-color = "#288000"
user-colors = "picker, #800000, #ff0000, #ffff00, #00ff00, #008000, #00ffff, #0000ff, #ff00ff, #800080"
buttons = "pencil, line, arrow, selection, rectangle, circle, marker, text, counter, pixelate, invert, move, undo, redo, copy, copy-text, save, exit, pin"
button-size = 0
show-help = true
show-side-panel-button = true
side-panel-width = 250
side-panel-size-label = "Active tool size:"
side-panel-color-label = "Active Color:"
side-panel-grab-label = "Grab Color"
side-panel-grid-label = "Display grid"
side-panel-no-tool = "Pick a tool"
side-panel-tab-label = "Tool Settings"
draw-thickness = 0
draw-font-size = 0
show-size-badge = false
magnifier = false
square-magnifier = false
copy-on-double-click = false
return = "copy"
start-mode = "text"
text-languages = ""
text-correction = true
text-column-gap = 1.0
text-toast = "Copied {} to clipboard"
no-text-toast = "No text found"
save-path = "/private/tmp"
save-path-fixed = false
filename-pattern = "%F_%H-%M"
save-format = "png"
jpeg-quality = 75
save-after-copy = false
copy-path-after-save = false
preview = true
save-last-region = false
undo-limit = 100
arrow-style = 0
reverse-arrow = false
counter-outline = true
insecure-pixelate = false
delay = 0
font = ""
copy-toast = "Capture saved to clipboard"
save-toast = "Capture saved as {}"
permission-toast = "Screen Recording permission needed — opening Settings…"
fail-toast = "Screen capture failed"
help-mouse = "Select screenshot area"
help-save = "Save screenshot to a file"
help-copy = "Copy selection to clipboard"
help-wheel = "Change tool size"
help-right-click = "Show color picker"
help-space = "Open side panel"
help-copy-text = "Copy text mode"
help-esc = "Exit"
help-text = "Drag over text to copy it"
help-text-mode = "Back to screenshot mode"

[pane-shot]
lines = 200
save = true
copy = true
preview = true
herdr-bin = "~/.local/bin/herdr"
ghostty-bin = "/Applications/Ghostty.app/Contents/MacOS/ghostty"
font = ""
font-size = ""
background = ""
padding = 16
save-path = ""
filename-pattern = "%F_%H-%M-%S pane"
toast = "Screenshot of {pane} copied ({n} lines)"

[files]
enabled = true
aliases = "Finder"
in-palette = true
label = "Files"
type = "files"
name = "files"
title = ""
root = "~/"
width = 760
height = 560
font = "SF Mono"
resize = true

favorites = "~/notes, ~/Desktop, /tmp"

start = "recent"

sort = "created"
sort-order = "desc"
background-color = 262335
header-color = 171520
browser-background = 99262335
text-color = "F0EFF5"
dim-color = "9D98C4"
highlight-color = 463465
accent-color = "FF7EDB"
palette = "36F9F6, 72F1B8, FEDE5D, FE4450, 03EDF9"

[jira]
enabled = true
in-palette = true
label = "Jira"
type = "list"
name = "jira"
title = ""

header-color = "19172A"
background-color = 232136
text-color = "E0DEF4"
dim-color = "908CAA"
highlight-color = "44415A"
accent-color = "EA9A97"
palette = "C4A7E7, 9CCFD8, F6C177, EB6F92, 3E8FB0"

sources = "~/.cache/kitchen-sink/jira_json"

my-work = true

table = true
compact-cells = false
reserve-label-width = true
primary = "key"
content = "title"
detail = "assignee,reporter,releaseLabel"
trailing = "status,priority"
body = "description"
filter = "key,title,status,assignee,reporter,description,labels,priority"
filters = "releaseStatus,release,assignee,reporter,status,priority,labels"
copy-fields = "key,title,status,assignee,release,releaseDate,priority,labels"
checkbox = true
resize = true
search-width = 0.9
max-row-stretch = 26
row-height = 32
width = 1100
height = 560
font = "SF Mono"
body-lines = 5
page-size = 150
browser-background = "4D4F596E"
sidebar-width = 310.1
sidebar-min-width = 140
sidebar-max-width = 480

# Jira status / priority names -> look (lowercased substrings, comma lists)
status-cancelled-words = "cancel, won't, wont, reject, duplicate"
status-done-words = "done, closed, resolved, released, complete, fixed, shipped"
status-blocked-words = "block, fail, impediment"
status-active-words = "progress, review, test, qa, develop, doing, verif"
status-waiting-words = "hold, wait, pending, paused"
status-new-words = "backlog, open, to do, todo, new, selected, triage, funnel"
priority-urgent-words = "highest, blocker, critical, urgent, p0, p1"

# The ticket panel (Jira's right pane): the drag range and the width the
# divider persists (`do:inspector-width:jira`). Mirror of the sidebar keys.
inspector-min-width = 180
inspector-max-width = 560
inspector-width = 273.8
table-sort = "project:desc"

[confluence]
enabled = true
in-palette = true
label = "Confluence"

width = 1400
height = 900

split = 0.42
sidebar-width = 140
sidebar-min-width = 140
sidebar-max-width = 480

[ai]
enabled = true
in-palette = true
label = "AI"
fm-bin = "/usr/bin/fm"

pandoc-bin = "/opt/homebrew/bin/pandoc"

context-tokens = 4096
rules-dir = "~/.config/kitchen-sink/rules"

split = 0.5

font-size = 14
font = ""

copy-toast = "Copied to clipboard"
background-color = "192330"
header-color = "0F141C"
text-color = "CDCECF"
dim-color = "AEAFB0"
highlight-color = "2B3B51"
accent-color = "719CD6"
palette = "9D79D6, 81B29A, DBC074, C94F6D, 63CDCF"

[icons]
kitchen-sink = "*:app"

[shortcuts]
"all: Hyper+S" = "palette: Find Recent Files, Create File, Text to Table, Pretty Print, then your workspaces + apps (one list)"
"all: Hyper+X" = "screenshot (Flameshot-style capture + annotate)"
"all: Hyper+/" = "ws-settings: every shortcut + setting (search, edit)"
"all: Cmd+W" = "hide the window"
"all: Ctrl+B L" = "prefix (in this window only): back to the previous view"
"all: Ctrl+B W" = "prefix: view switcher — the app's views (type / for every command); type to filter, Ctrl+N/P move, Return opens"
"all: Ctrl+B T" = "prefix: toggle the terminal popup"
"all: Ctrl+B B" = "prefix: sidebar ⇄ icon rail (same as Cmd+\\)"
"all: Ctrl+B Ctrl+B" = "a real Ctrl+B for the focused pane (vim page up, the shell)"
"all: Ctrl+H / J / K / L" = "move to the pane on that side: sidebar, list, preview, terminal; a thin silver ring shows which pane has the keys"
"all: Ctrl+B Ctrl+H" = "the real Ctrl+H for the pane (same for J / K / L: a shell's Ctrl+L clear, a field's Ctrl+H)"
"sidebar: ↑ ↓ / Ctrl+N / Ctrl+P" = "move through the rows (Ctrl+H from the content puts the keys here)"
"sidebar: Return" = "open the row and go back to the content"
"sidebar: Space" = "open the row, stay in the sidebar"
"sidebar: Home / End / PgUp / PgDn" = "jump in the rows"
"sidebar: a letter" = "the next row starting with it"
"sidebar: Esc" = "back to the content"
"preview: ↑ ↓ / PgUp / PgDn / Space" = "scroll the page (Shift+Space = back up)"
"preview: Cmd+A / Cmd+C" = "select all / copy"
"all: Ctrl+W" = "any text field (popups, search bars, sheets, editors): delete the word before the cursor (the terminal keeps its own Ctrl+W)"
"all: j / k" = "normal mode (a sidebar, list, preview — the NORMAL chip): down / up"
"all: gg / G" = "normal mode: first / last row (a page: top / bottom)"
"all: Ctrl+D / Ctrl+U" = "normal mode: half a screen down / up"
"all: / or ?" = "normal mode: search the focused pane forward / backward as you type (ignore case); Return keeps the match, Esc goes back, ↑↓ / Ctrl+N/P step"
"all: n / N" = "normal mode: next / previous match of the last search"
"all: i / a" = "normal mode: insert — the pane's text input (a list's filter box)"
"all: Esc (in an input)" = "back to normal mode (the filter stays); Esc again = the view's usual Esc"
"all: Cmd+\\" = "collapse the sidebar to an icon rail / show it again"
"all: Cmd+Plus / Cmd+Minus" = "zoom the text (font size)"
"all: Cmd+Opt+Plus / Cmd+Opt+Minus" = "grow / shrink the window"
"all: Ctrl+Shift+H / J / K / L" = "resize the window (tmux style; Ctrl+Shift only, no Cmd/Opt)"
"all: Cmd+/" = "this list"
"all: Cmd+," = "Settings (ws-settings, same as Hyper+/)"
"all: Cmd+0" = "reset the window to its default size"
"all: Cmd+F / Cmd+G / Cmd+Shift+G" = "in a text box or text preview (AI, Files preview): find bar, next / previous match"
"all: Opt+← → / Cmd+← → / Opt+Delete / Ctrl+A E K" = "any text field: the standard Mac editing keys (word, line, delete word, line start / end / kill)"
"palette: ↑ ↓ / Ctrl+N / Ctrl+P / Tab" = "move through the list"
"palette: Return" = "run the command / go to the workspace"
"palette: Cmd+1…9" = "run the Nth row (Raycast style)"
"palette: Cmd+↑ / Cmd+↓" = "first / last row"
"palette: Esc" = "clear the filter, else close"
"files: ↑ ↓ / Ctrl+N / Ctrl+P" = "move through the list"
"files: Return / Cmd+O / Cmd+Down" = "open (folders: go in)"
"files: ← / →" = "parent folder / open"
"files: Opt+→ / Opt+←" = "expand / collapse the selected folder in place"
"files: Cmd+T / Cmd+W" = "new tab / close the tab (the last one hides the window)"
"files: Cmd+Shift+] / Cmd+Shift+[" = "next / previous tab"
"files: Tab" = "complete the typed path"
"files: Cmd+L / Cmd+F" = "focus the filter / address bar (in it, Cmd+A/C/V/X/Z edit the text)"
"files: Cmd+Shift+G" = "Go to Folder: the address bar with its text selected"
"files: Cmd+Shift+H / D / O, Cmd+Opt+L" = "go to Home / Desktop / Documents / Downloads"
"files: Cmd+K / Cmd+Opt+C" = "copy the selected file's path"
"files: Cmd+R / F2 / click the selected name" = "rename the file (Return renames, Esc cancels); several selected: Rename N Items (replace / add / number)"
"files: Space / Cmd+Y" = "Quick Look the selected file (Cmd+Opt+Y = full screen)"
"files: Cmd+I" = "Get Info: kind, size, where, dates, permissions"
"files: Shift+click / Cmd+click / Cmd+A" = "select several files"
"files: Cmd+Opt+A" = "deselect all"
"files: Cmd+C / Cmd+X / Cmd+V" = "copy / cut / paste files (in the list)"
"files: Cmd+D" = "duplicate"
"files: Cmd+Delete" = "move to the Trash"
"files: Cmd+Opt+Delete" = "delete immediately (asks first, no undo)"
"files: Cmd+Shift+Delete" = "empty the Trash (asks first)"
"files: Cmd+Z / Cmd+Shift+Z" = "undo / redo the last rename / move / copy / trash"
"files: Cmd+Shift+N" = "new folder"
"files: Cmd+Ctrl+N" = "new folder with the selected files in it"
"files: Cmd+Ctrl+T" = "pin the selected folder (else this one) to the sidebar"
"files: Cmd+Shift+P" = "show / hide the preview pane"
"files: Cmd+Opt+S" = "show / hide the sidebar (same as Cmd+\\)"
"files: Cmd+Ctrl+Opt+1 / 2 / 5 / 6 / 7" = "sort by name / kind / date modified / date created / size"
"files: Cmd+E" = "eject the volume (under /Volumes)"
"files: Cmd+[ / Cmd+]" = "back / forward"
"files: Cmd+Up" = "parent folder (Recent: the file's folder)"
"files: Cmd+Down" = "open the selected row"
"files: Cmd+Opt+V" = "move the copied files here"
"files: Shift+↑ / Shift+↓" = "grow the selection"
"files: Home / End / PgUp / PgDn" = "jump in the list"
"files: Cmd+Shift+." = "show / hide hidden files"
"files: **" = "in the filter: search every folder below"
"files: term" = "in the filter + Return: a shell in that folder"
"files: Esc Esc" = "hide"
"jira: Cmd+F" = "live search (from the search strip: close it)"
"jira: Cmd+L" = "focus the search box"
"jira: Cmd+I" = "show / hide the issue panel (Return opens the full detail)"
"jira: Space s f" = "jump to a sidebar item (My work, boards, releases, lists): type to filter, Return opens"
"jira: Cmd+K" = "actions: copy, copy URL + title, open in browser"
"jira: Cmd+C / Cmd+Shift+C" = "copy the row(s) ([jira] copy fields) / URL + title"
"jira: Cmd+Return / Cmd+O" = "open in the browser"
"jira: Cmd+R" = "sync now"
"jira: Shift+↑ / Shift+↓ / Cmd+A / Cmd+Opt+A" = "tick rows while moving / tick all / clear the ticks"
"jira: Return / double-click" = "ticket details"
"jira: ↑ ↓ / Ctrl+N / Ctrl+P / Tab" = "move through the rows"
"jira: Home / End / PgUp / PgDn" = "jump in the list"
"jira: Ctrl+Space" = "tick the row (Cmd+K acts on ticked rows)"
"jira: Esc" = "back (details, releases, config) / close the search"
"jira: 1-9" = "in the Cmd+K menu: run that action"
"ai: Ctrl+Enter / Cmd+Enter" = "run the selected rule on your text"
"ai: Cmd+L" = "focus your text"
"ai: Cmd+Z / Cmd+Shift+Z" = "undo / redo in your text"
"ai: Esc" = "stop a running request; idle: hide (only when Esc Hides Window is on)"
"confluence: Return" = "search; in the results: open in the browser"
"confluence: ↑ ↓ / Ctrl+N / Ctrl+P" = "move through the results"
"confluence: Cmd+Return / Cmd+O" = "open in the browser"
"confluence: Cmd+C / Cmd+Shift+C" = "copy the link / title + link"
"confluence: Cmd+D" = "star / unstar the page (☆)"
"confluence: Cmd+G / Cmd+Shift+G" = "next / previous match in the page"
"confluence: Cmd+L / Cmd+F" = "focus the search box"
"confluence: Cmd+R" = "search again"
"confluence: Esc" = "close an open filter, else clear the query"
"paths: ↑ ↓ / Ctrl+N / Ctrl+P" = "move (Shift = grow the selection)"
"paths: Return" = "[paths] return: file | path | open"
"paths: Cmd+C / Cmd+K" = "copy the path text"
"paths: Cmd+Shift+C" = "copy the file(s)"
"paths: Space / Cmd+Y" = "Quick Look"
"paths: Cmd+O" = "open"
"paths: Cmd+R" = "rename"
"paths: Cmd+Shift+R" = "reveal in Finder"
"paths: Cmd+Delete" = "forget the row"
"paths: Esc / Cmd+W" = "close"
"text-table: Cmd+Return" = "copy the table for Outlook (pastes as a real table)"
"text-table: Cmd+Shift+Return" = "save the Markdown table as a .md file and copy it"
"text-table: Esc" = "close and go back to the app you came from"
"screenshot: Mouse drag" = "select an area (Shift = square); drag inside = move it"
"screenshot: P D A S R C M T B I" = "pencil, line, arrow, rectangle, filled rectangle, circle, marker, text, pixelate, invert (again = off)"
"screenshot: G" = "grab a color from the screen (Esc cancels)"
"screenshot: Space" = "side panel (size, color, grid, text style, layers)"
"screenshot: ← ↑ → ↓" = "move the selection 1 pt (Shift = resize, Cmd+Shift = from the center)"
"screenshot: Cmd+A" = "select the whole display"
